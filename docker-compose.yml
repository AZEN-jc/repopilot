version: "3.9"

services:
  # Schema bootstrap. One-shot: it runs the compiled migration runner, exits 0,
  # and both database-touching processes wait for that exit code.
  #
  # This service exists because nothing else applies migrations. `api` starts
  # `server.js` and `worker` starts `worker.js`; neither calls `runMigrations`.
  # Without this, a fresh `docker compose up -d` brings up an API whose
  # `checkDatabase` probe (`repo.list(1)`, `server.ts`) throws `no such table`,
  # so `/health` reports `degraded` forever and every audit POST fails at the
  # database — while every container still reports healthy, because `/health`
  # answers HTTP 200 either way.
  #
  # This file used to say "run `pnpm db:migrate` once" instead. That step
  # cannot be run here: the runtime image carries `dist/` and `node_modules/`
  # but not `tsx`, which is what the `db:migrate` script shells out to. The
  # runner is reachable as `dist/db/migrate.js`, so it is invoked directly.
  #
  # Safe to re-run on every `up`: every statement in `runMigrations` is
  # `CREATE ... IF NOT EXISTS` / `ADD COLUMN IF NOT EXISTS` (see
  # `apps/api/src/db/client.ts`).
  migrate:
    build: .
    image: repopilot:latest
    container_name: repopilot-migrate
    # A job, not a server: never restart it, and its exit code is the signal.
    restart: "no"
    command: ["node", "apps/api/dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      AUDIT_QUEUE_DRIVER: pg-boss
      DATABASE_URL: postgresql://repopilot:repopilot@db:5432/repopilot
      PAYMENT_MODE: ${PAYMENT_MODE:-okx}
      OKX_PAYMENT_ADDRESS: ${OKX_PAYMENT_ADDRESS:-}
      # Every process that calls `loadConfig()` runs the production guards,
      # including this one-shot migration job — it never builds a payment
      # adapter, but it still refuses to start without the payment config
      # (R-02: fail at boot rather than half-start). So this has to be set
      # here too, or `docker compose up` hangs on a migrate container that
      # exited 1.
      OKX_PAYMENT_RESOURCE_URL: ${OKX_PAYMENT_RESOURCE_URL:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: repopilot:latest
    container_name: repopilot-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REPOPILOT_API_MODE: http
      AUDIT_QUEUE_DRIVER: pg-boss
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://repopilot:repopilot@db:5432/repopilot
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOWED_REPO_HOSTS: github.com,raw.githubusercontent.com
      PAYMENT_MODE: ${PAYMENT_MODE:-okx}
      OKX_PAYMENT_ADDRESS: ${OKX_PAYMENT_ADDRESS:-}
      OKX_PAYMENT_NETWORK: ${OKX_PAYMENT_NETWORK:-xlayer}
      # What the 402 challenge names as the thing being paid for. Must be this
      # deployment's own public URL; the production guard rejects a reserved
      # host, an empty value, or anything that is not https.
      OKX_PAYMENT_RESOURCE_URL: ${OKX_PAYMENT_RESOURCE_URL:-}
      PRICE_AUDIT: ${PRICE_AUDIT:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Which peer's `X-Forwarded-For` the API believes. `web` is the only
      # thing that talks to the API, and it does so over the compose network —
      # so the peer this process sees is nginx's *container* address, never
      # loopback. The variable's built-in default is loopback, which matches
      # nothing here: leaving it unset is not "no proxy configured", it is
      # "every caller is keyed by the edge's address", i.e. one 60/min bucket
      # shared by the whole internet. Not a bypass — an outage that only shows
      # up under load.
      #
      # The address is pinned in `web.networks` below rather than left to
      # Docker, so the two cannot drift; `compose:check` fails if they do.
      TRUSTED_PROXY_IPS: ${REPOPILOT_EDGE_IP:-172.28.0.10}
    ports:
      # Loopback only, deliberately. The public entry point is the `web`
      # service; this mapping exists so an operator can still run
      # `curl http://127.0.0.1:4000/health` on the host.
      #
      # Publishing the API on every interface would make it a second, unchecked
      # entry point. `trustProxy: true` (`server.ts`) still makes `req.ip`
      # follow `X-Forwarded-For` from anyone, so a direct client can forge the
      # address that every log line reports. The rate limiter is no longer
      # among the things that would be fooled — it keys on the socket peer and
      # reads the header only from a peer in `TRUSTED_PROXY_IPS`
      # (`middleware/rate-limit.ts`, R-24) — but the edge is the only place
      # supposed to see this traffic, and a loopback binding is what makes that
      # true rather than merely intended.
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  # The only service that publishes a port to the world. It serves the built UI
  # at `/` and proxies `/api/*`, `/health` and `/docs/*` to `api:4000`; the
  # routing table and the reasoning live in `deploy/nginx/repopilot.conf`.
  #
  # `depends_on: service_healthy` here is about *start order*, not liveness.
  # Compose does not tear down or restart a dependent service when a dependency
  # later fails, so gating the edge on the API's first healthy moment does not
  # mean "an API outage takes the UI down with it" — the edge keeps serving the
  # static shell, which is exactly what its own healthcheck measures.
  web:
    build:
      context: .
      target: web
    image: repopilot-web:latest
    container_name: repopilot-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      default:
        # Pinned so that `api`'s `TRUSTED_PROXY_IPS` can name a stable address
        # instead of one Docker would otherwise choose per `up`. The same
        # `${REPOPILOT_EDGE_IP:-...}` is written in both places on purpose:
        # one variable, one fallback, and `compose:check` asserts they still
        # agree. See the `networks:` block at the bottom of this file.
        ipv4_address: ${REPOPILOT_EDGE_IP:-172.28.0.10}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Asks whether the *deployment* works, not merely whether the process is
      # alive: nginx answering on `/healthz` only proves nginx started, so this
      # fetches `/` and looks for the built entry document. Deliberately not a
      # proxied `/health` — that would restart the edge during an API outage.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'id=\"root\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: repopilot:latest
    container_name: repopilot-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      AUDIT_QUEUE_DRIVER: pg-boss
      DATABASE_URL: postgresql://repopilot:repopilot@db:5432/repopilot
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOWED_REPO_HOSTS: github.com,raw.githubusercontent.com
      PAYMENT_MODE: ${PAYMENT_MODE:-okx}
      OKX_PAYMENT_ADDRESS: ${OKX_PAYMENT_ADDRESS:-}
      # Same reason as the `migrate` service above: the worker calls
      # `loadConfig()`, so it runs the production payment guards.
      OKX_PAYMENT_RESOURCE_URL: ${OKX_PAYMENT_RESOURCE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Scale with: docker compose up --scale worker=N
    # The healthcheck below only ensures the process is alive (it
    # doesn't bind a port). Worker liveness is verified through the
    # process heartbeat log and the queue health endpoint on the API.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: repopilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_DB: repopilot
    volumes:
      - repopilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # The compose bridge, with its subnet pinned.
  #
  # Pinning is not a preference: it is what makes the static `ipv4_address` on
  # `web` legal. Compose refuses to honour one on a network whose subnet it
  # would otherwise pick itself, because that range is not known until `up`.
  #
  # Override both together if 172.28.0.0/24 is already taken on the host —
  # `REPOPILOT_NET_SUBNET` and `REPOPILOT_EDGE_IP` — keeping the address inside
  # the subnet. A collision fails loudly at `up`, not silently at runtime.
  default:
    ipam:
      config:
        - subnet: ${REPOPILOT_NET_SUBNET:-172.28.0.0/24}

volumes:
  repopilot-db:
